name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS (WordPress-Extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        id: setup-php
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpcs

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        id: setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-
      - run: composer install --no-interaction --prefer-dist
      # The repo's unit suite runs against lightweight stubs (tests/bootstrap.php),
      # no WordPress install. There is deliberately no integration matrix or
      # static-analysis gate here yet — see docs/RELEASE.md "Known limitations".
      - run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite unit

  package:
    name: Release package (build validation, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build the release package
        run: bash scripts/build-release-package.sh
      - name: Inspect the artifact
        run: |
          set -euo pipefail
          zip="$(ls dist/universal-site-announcements-*.zip)"
          sum="$(ls dist/universal-site-announcements-*.zip.sha256)"
          test -s "$zip"
          test -s "$sum"
          echo "== ZIP contents =="
          unzip -l "$zip"
          ( cd dist && sha256sum -c "$(basename "$sum")" )
          names="$(unzip -Z1 "$zip")"
          test "$(printf '%s\n' "$names" | cut -d/ -f1 | sort -u)" = "universal-site-announcements"
          printf '%s\n' "$names" | grep -qx 'universal-site-announcements/universal-site-announcements.php'
          printf '%s\n' "$names" | grep -qx 'universal-site-announcements/vendor/autoload.php'
          ! printf '%s\n' "$names" | grep -qE '/(\.git|\.github|tests|docs|scripts|node_modules)/'
